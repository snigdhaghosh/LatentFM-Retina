common:
  dataset: drive
  data_root: data/DRIVE
  out_dir: outputs/drive
  image_size: 256
  # Step 1 (patch-based augmentation): training images are first resized to
  # this size (preserves more vessel detail than image_size=256) and then a
  # random `image_size` window is cropped at every training step. Eval still
  # runs at image_size. Set to null to revert to the old behavior.
  train_resize: 384
  num_workers: 0
  seed: 0
  device: null

vae:
  base_channels: 64
  channel_mults: [1, 2, 4]
  num_res_blocks: 2
  attn_levels: [2]
  latent_channels: 3
  batch_size: 4
  epochs: 800      # DRIVE is small; we train longer (was 400)
  lr: 5.0e-5       # was 1e-5; 1e-5 was too conservative for 15 train images
  kl_weight: 1.0e-6
  val_every: 10
  save_every: 25
  image:
    kl_weight: 1.0e-6
  mask:
    # DRIVE vessels are sparse. Soft-Dice handles the imbalance natively, so
    # we no longer rely on a bce_pos_weight knob; it stays as a fallback if
    # someone switches recon_type back to bce_l1.
    kl_weight: 1.0e-6
    bce_pos_weight: 12.0
    recon_type: dice
  augmentation:
    flip_prob: 0.5
    rotate_max_deg: 30   # was 15

fm:
  base_channels: 64
  channel_mults: [1, 2, 2, 4]
  num_res_blocks: 2
  attn_levels: [2, 3]
  time_embed_dim: 256
  sigma: 0.0
  batch_size: 4
  epochs: 800           # was 400
  lr: 5.0e-5            # was 1e-5
  # Step 2: bigger ODE ensemble. Sweep on val showed N=16 buys ~+0.02 Dice
  # over N=5 with negligible threshold sensitivity. Cost: ~15 min on MPS.
  n_inference_samples: 16
  n_inference_steps: 50
  # Step 3: validation knobs. n_validation_samples is the cheaper N used
  # during training (full N=16 val would balloon training time). val_every
  # then governs how often we pay that cost.
  n_validation_samples: 5
  # Step 3b: EMA decay for inference weights. 0.999 is a standard FM default.
  # On a tiny dataset like DRIVE, the EMA half-life (~700 updates) is several
  # hundred epochs, so the EMA effectively averages the late-training plateau.
  ema_decay: 0.999
  val_every: 10
  save_every: 25

eval:
  batch_size: 4
  save_n: 20
  # Step 2: best from val sweep at N=16 was thr=0.325 (Dice 0.6565). The
  # Dice curve is flat between 0.275 and 0.40 so 0.325 is a robust pick.
  threshold: 0.325
  ode_method: heun
