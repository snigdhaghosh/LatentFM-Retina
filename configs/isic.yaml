common:
  dataset: isic
  data_root: data/ISIC2016
  out_dir: outputs/isic
  image_size: 256
  num_workers: 2
  seed: 0
  device: null   # auto: cuda > mps > cpu

vae:
  base_channels: 64
  channel_mults: [1, 2, 4]
  num_res_blocks: 2
  attn_levels: [2]
  latent_channels: 3
  batch_size: 4
  epochs: 250
  lr: 1.0e-5
  kl_weight: 1.0e-6
  val_every: 5
  save_every: 10
  image:
    kl_weight: 1.0e-6
  mask:
    kl_weight: 1.0e-6
    bce_pos_weight: null

fm:
  base_channels: 64
  channel_mults: [1, 2, 2, 4]
  num_res_blocks: 2
  attn_levels: [2, 3]
  time_embed_dim: 256
  sigma: 0.0
  batch_size: 4
  epochs: 250
  lr: 1.0e-5
  n_inference_samples: 5
  n_inference_steps: 50
  val_every: 5
  save_every: 10

eval:
  batch_size: 4
  save_n: 16
